############################################
# Vector K8S DaemonSet - Containerd CRI
# Baseline: Vector 0.58.0
############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
data:
  vector.yaml: |
    data_dir: "/var/lib/vector"

    api:
      enabled: true
      address: "0.0.0.0:8686"

    sources:
      k8s_logs:
        type: kubernetes_logs
        auto_partial_merge: true
        self_node_name: ${VECTOR_SELF_NODE_NAME}
        insert_namespace_fields: false

        # Rapidly rotated files must be discovered before the runtime compresses them.
        glob_minimum_cooldown_ms: 5000
        oldest_first: false
        max_read_bytes: 65536
        rotate_wait_secs: 300
        delay_deletion_ms: 300000

        extra_label_selector: 'app!=fluentd,app!=vector,app!=vector-log'
        extra_field_selector: 'metadata.namespace!=kube-system,metadata.namespace!=monitoring,metadata.namespace!=logging'

        # Explicit patterns replace Vector defaults. Always retain .gz and .tmp.
        exclude_paths_glob_patterns:
          - "**/*.gz"
          - "**/*.tmp"
          - "/var/log/pods/kube-system_*/*/*.log"
          - "/var/log/pods/monitoring_*/*/*.log"
          - "/var/log/pods/logging_*/*/*.log"
          - "/var/log/pods/*/init-*/**"
          - "/var/log/pods/*/wait-for-*/**"
          - "/var/log/pods/*/sidecar/*.log"
          - "/var/log/pods/*/istio-proxy/*.log"

    transforms:
      filter_java_logs:
        type: filter
        inputs: [k8s_logs]
        condition: |
          message = string(.message) ?? ""
          container_name = string(.kubernetes.container_name) ?? ""
          !contains(message, "/actuator/health") &&
          !contains(message, "/health") &&
          container_name != "sidecar" &&
          container_name != "istio-proxy"

      enhance_multiline:
        type: reduce
        inputs: [filter_java_logs]
        group_by:
          - kubernetes.pod_name
          - kubernetes.container_name
        starts_when: |
          match(string(.message) ?? "", r'^(\d{4}-\d{2}-\d{2}(?:T|\s)\d{2}:\d{2}:\d{2}|\b(INFO|WARN|DEBUG|ERROR|FATAL|TRACE)\b)')
        expire_after_ms: 3000
        merge_strategies:
          message: concat_newline

      add_msg_field:
        type: remap
        inputs: [enhance_multiline]
        source: |
          msg, err = string(.message)
          if err != null { msg = "" }
          msg = replace(msg, "\0", "")
          .message = msg
          ._msg = msg

          caps, perr = parse_regex(msg, r'^\d{4}-\d{2}-\d{2}(?:T|\s)\d{2}:\d{2}:\d{2}(?:\.\d+)?\s+(?P<lvl>TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\b')
          if perr == null && caps != null {
            .level = downcase(to_string(caps.lvl))
          } else {
            .level = "unknown"
          }

    sinks:
      victorialogs:
        type: loki
        inputs: [add_msg_field]
        endpoint: "${VLS_ENDPOINT}"
        path: /insert/loki/api/v1/push
        out_of_order_action: accept
        labels:
          job: java-app
          namespace: "{{ kubernetes.pod_namespace }}"
          pod: "{{ kubernetes.pod_name }}"
          container: "{{ kubernetes.container_name }}"
          level: "{{ level }}"
        encoding:
          codec: json
        batch:
          max_bytes: 1048576
          max_events: 500
          timeout_secs: 1
        buffer:
          type: disk
          max_size: 1073741824
          when_full: block
        compression: none
        healthcheck: false
        request:
          timeout_secs: 60
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: logging
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
  labels:
    app: vector
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      terminationGracePeriodSeconds: 120
      serviceAccountName: vector
      # For a private mirror, add an imagePullSecrets entry here.
      containers:
        - name: vector
          image: timberio/vector:0.58.0-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VLS_ENDPOINT
              value: "http://victorialogs.logging.svc.cluster.local:9428"
            - name: VECTOR_LOG
              value: warn
            # Vector 0.57+ disables interpolation by default. Only controlled,
            # non-secret Downward API and endpoint values are interpolated here.
            - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
              value: "true"
            - name: TZ
              value: Asia/Shanghai
            - name: PROCFS_ROOT
              value: /host/proc
            - name: SYSFS_ROOT
              value: /host/sys
          ports:
            - name: api
              containerPort: 8686
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: "4"
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: data
              mountPath: /var/lib/vector
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: run-containerd
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            - name: var-lib-containerd
              mountPath: /var/lib/containerd
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log
        - name: run-containerd
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: var-lib-containerd
          hostPath:
            path: /var/lib/containerd
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
