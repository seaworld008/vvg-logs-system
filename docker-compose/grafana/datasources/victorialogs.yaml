apiVersion: 1

datasources:
  - name: VictoriaLogs
    uid: victorialogs-ds
    type: victoriametrics-logs-datasource
    access: proxy
    url: ${VICTORIALOGS_URL}
    isDefault: true
    editable: false
    jsonData:
      maxLines: 2000
      timeout: 60

# VICTORIALOGS_URL 由 Compose 环境变量注入。
# 跨主机部署使用可路由的内网地址，不要使用 Grafana 容器内的 localhost。
# 同一 Docker 网络可使用 http://victorialogs:9428。
