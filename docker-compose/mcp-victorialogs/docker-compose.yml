version: "2.4"

services:
  vmauth:
    image: ${VMAUTH_IMAGE}
    container_name: vvg-mcp-vmauth
    restart: always
    user: "65534:65534"
    command:
      - -auth.config=/etc/vmauth/auth.yml
      - -httpListenAddr=:8427
      - -httpInternalListenAddr=:8428
      - -maxConcurrentRequests=8
      - -maxConcurrentPerUserRequests=4
      - -maxQueueDuration=2s
      - -loggerFormat=json
      - -loggerOutput=stderr
    ports:
      - "${MCP_BIND_ADDRESS}:${MCP_PORT}:8427"
    volumes:
      - ./vmauth/auth.yml:/etc/vmauth/auth.yml:ro
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8428/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  mcp-victorialogs:
    image: ${MCP_VICTORIALOGS_IMAGE}
    container_name: vvg-mcp-victorialogs
    restart: always
    depends_on:
      vmauth:
        condition: service_healthy
    environment:
      VL_INSTANCE_ENTRYPOINT: http://vvg-mcp-vmauth:8427
      VL_INSTANCE_BEARER_TOKEN: ${VL_PROXY_BEARER_TOKEN}
      VL_DEFAULT_TENANT_ID: ${VL_DEFAULT_TENANT_ID}
      MCP_SERVER_MODE: http
      MCP_LISTEN_ADDR: 0.0.0.0:8081
      MCP_DISABLED_TOOLS: documentation,flags,facets,streams,stream_ids,stream_field_names,stream_field_values,stats_query_range
      MCP_HEARTBEAT_INTERVAL: 30s
      MCP_LOG_FORMAT: json
      MCP_LOG_LEVEL: info
    expose:
      - "8081"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8081/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
