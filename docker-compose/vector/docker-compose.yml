services:
  vector:
    image: ${DOCKER_REGISTRY}/timberio/vector:${VECTOR_VERSION}
    container_name: vector
    restart: unless-stopped
    stop_grace_period: 30s
    user: root
    environment:
      - VECTOR_LOG=${VECTOR_LOG_LEVEL}
      - TZ=${TIMEZONE}
      - VLS_ENDPOINT=${VLS_ENDPOINT}
      - HOSTNAME=${VECTOR_HOSTNAME}
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - ${NGINX_LOG_PATH}:/var/log/nginx:ro
      - ${JAVA_LOG_PATH}:/var/log/java:ro
      - ${VECTOR_DATA_DIR}:/var/lib/vector
    ports:
      - "${VECTOR_API_BIND}:${VECTOR_PORT}:8686"
    networks:
      - vvg-monitoring
    # 资源上限：cgroup 使用上限，不是预占。已有部署先用 docker stats 测稳态内存，再设置
    # VECTOR_MEM_LIMIT（建议不低于稳态的 1.5 倍，并覆盖节点重启后的追赶峰值）。
    cpus: ${VECTOR_CPUS:-1.0}
    mem_limit: ${VECTOR_MEM_LIMIT:-1g}
    memswap_limit: ${VECTOR_MEM_LIMIT:-1g}
    # 日志驱动 & 轮转，防止容器日志过大
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8686/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  vvg-monitoring:
    driver: bridge
    name: ${DOCKER_NETWORK}
