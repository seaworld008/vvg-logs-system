services:
  clickhouse:
    image: registry.example.com/observability/clickhouse/clickhouse-server:26.8.2.7-alpine
    pull_policy: never
    container_name: gateway-clickhouse
    hostname: gateway-clickhouse
    network_mode: host
    restart: always
    stop_grace_period: 2m
    environment:
      TZ: Asia/Shanghai
      CLICKHOUSE_DB: gateway_logs
      CLICKHOUSE_USER: vector_ingest
      CLICKHOUSE_PASSWORD: CHANGE_ME_BEFORE_DEPLOY
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./data:/var/lib/clickhouse
      - ./logs:/var/log/clickhouse-server
      - ./config:/etc/clickhouse-server/config.d:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cpus: 3.0
    mem_limit: 8g
    mem_reservation: 2g
    memswap_limit: 8g
    pids_limit: 4096
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$${CLICKHOUSE_USER:-default}"
          --password "$${CLICKHOUSE_PASSWORD:-}"
          --query "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
