name: Validate VVG configurations

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned AutoMQ manifest dependency
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-automq.txt

      - name: Check generated Nightingale AutoMQ dashboard
        run: node scripts/render-automq-nightingale-dashboard.mjs --check

      - name: Run static configuration checks
        run: bash scripts/validate-configs.sh --static

      - name: Run Compose and Vector validation
        run: bash scripts/validate-configs.sh --runtime

      - name: Validate host log migration and file recovery
        run: |
          python -m unittest discover -s scripts/tests -p test_host_log_collector.py -v
          python scripts/test-host-log-runtime.py
          python scripts/test-host-log-backfill.py
          python scripts/test-host-consumer-labels.py
          python scripts/test-vvg-substring-query.py
